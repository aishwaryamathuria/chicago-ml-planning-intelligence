services:
  db:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    volumes:
      - ./Chicagodb_bronze.sql:/docker-entrypoint-initdb.d/Chicagodb_bronze.sql
      - ./Chicagodb_silver.sql:/docker-entrypoint-initdb.d/Chicagodb_silver.sql
      - ./Chicagodb_gold.sql:/docker-entrypoint-initdb.d/Chicagodb_gold.sql
    ports:
      - "5432:5432"
